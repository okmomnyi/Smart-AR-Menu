name: ar-menu

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ar_menu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ar_menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ar_menu}
    # Not published to the host: only the backend needs to reach it.
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ar_menu} -d ${POSTGRES_DB:-ar_menu}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ar_menu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ar_menu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ar_menu}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-ar_menu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ar_menu}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      # 0 when you call the published port directly; 1 behind one proxy or tunnel.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      API_PATH_PREFIX: ${API_PATH_PREFIX:-}

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}

      # Uploads are disabled until these are set; the app still runs without them.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-2147483648}
    # Loopback only. Docker writes its own iptables rules, so a port published
    # on all interfaces is reachable from the internet even when ufw denies it.
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Web ─────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so they must be
        # build args rather than runtime environment.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MEDIA_HOSTNAME: ${NEXT_PUBLIC_MEDIA_HOSTNAME:-}
    container_name: ar_menu_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the API over the compose network; the
      # browser uses NEXT_PUBLIC_API_URL instead.
      API_INTERNAL_URL: http://backend:4000
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres_data:
    driver: local
